<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger King Combo Optimizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-orange-600 mb-8">🍔 Burger King Combo Optimizer</h1>

        <!-- Section Sélection -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">1. Que veux-tu manger ?</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- Choix du Burger -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Burger / Plat principal</label>
                    <select id="select-burger" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500">
                        <option value="">Chargement...</option>
                    </select>
                </div>
                <!-- Choix de l'accompagnement -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Accompagnement (Frites, etc.)</label>
                    <select id="select-side" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500">
                        <option value="">Chargement...</option>
                    </select>
                </div>
                <!-- Choix de la boisson -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Boisson / Dessert</label>
                    <select id="select-drink" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500">
                        <option value="">Chargement...</option>
                    </select>
                </div>
            </div>

            <button onclick="calculateBestCombo()" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700 transition">
                Trouver les meilleurs combos 🚀
            </button>
        </div>

        <!-- Section Résultats (Top 3) -->
        <div id="results-container" class="hidden">
            <h2 class="text-xl font-semibold mb-4 text-center">2. Top 3 des formules les plus rentables</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end" id="podium-grid">
                <!-- Les cartes du podium seront injectées ici -->
            </div>
        </div>
    </div>

<script>
    const WEBHOOK_URL = 'https://n8n.mvincent.xyz/webhook/burger-king-prices';
    let globalCatalog = null;

    async function loadCatalog() {
        try {
            const response = await fetch(WEBHOOK_URL);
            const data = await response.json();
            const catalogData = Array.isArray(data) ? data[0] : data;
            globalCatalog = catalogData.catalog;

            console.log("Catalogue chargé :", globalCatalog);

            // Filtrer les produits selon leur nom ou leur catégorie
            const burgers = globalCatalog.products.filter(p => {
                const name = p.name.toLowerCase();
                // On filtre pour ne garder que ce qui ressemble à un burger/plat principal
                return !name.includes('coca') && !name.includes('fanta') && !name.includes('sprite') && 
                       !name.includes('frite') && !name.includes('eau') && !name.includes('fuse tea') &&
                       !name.includes('nuggets') && !name.includes('king fusion') && !name.includes('sundae');
            });

            const sides = globalCatalog.products.filter(p => {
                const name = p.name.toLowerCase();
                // Accompagnements : frites, king fries, onion rings, nuggets, etc.
                return name.includes('frite') || name.includes('king fries') || name.includes('onion') || 
                       name.includes('nuggets') || name.includes('chili cheese') || name.includes('potatoes');
            });

            const drinks = globalCatalog.products.filter(p => {
                const name = p.name.toLowerCase();
                // Boissons et desserts
                return name.includes('coca') || name.includes('fanta') || name.includes('sprite') || 
                       name.includes('eau') || name.includes('fuse tea') || name.includes('oasis') || 
                       name.includes('sundae') || name.includes('fusion') || name.includes('glace');
            });

            // Remplir les listes de manière spécifique
            populateSelect('select-burger', burgers.length > 0 ? burgers : globalCatalog.products);
            populateSelect('select-side', sides.length > 0 ? sides : globalCatalog.products);
            populateSelect('select-drink', drinks.length > 0 ? drinks : globalCatalog.products);

        } catch (error) {
            console.error("Erreur de chargement :", error);
            alert("Erreur lors de la récupération des données via n8n.");
        }
    }

    function populateSelect(elementId, items) {
        const select = document.getElementById(elementId);
        select.innerHTML = '<option value="">-- Sélectionner --</option>';
        
        items.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = `${item.name} ${item.price > 0 ? '(' + item.price.toFixed(2) + ' €)' : ''}`;
            select.appendChild(option);
        });
    }

    function calculateBestCombo() {
        const burgerId = document.getElementById('select-burger').value;
        if (!burgerId) {
            alert("Veuillez au moins sélectionner un burger !");
            return;
        }

        document.getElementById('results-container').classList.remove('hidden');
        
        const selectedBurger = globalCatalog.products.find(p => p.id === burgerId);
        const burgerPrice = selectedBurger && selectedBurger.price > 0 ? selectedBurger.price : 8.00;
        
        const aLaCartePrice = burgerPrice + 3.50 + 3.00; 
        const menuMPrice = burgerPrice + 2.50; 
        const menuKingSizePrice = menuMPrice + 1.50; 

        const podiumGrid = document.getElementById('podium-grid');
        podiumGrid.innerHTML = `
            <div class="bg-white p-4 rounded-lg shadow border-t-4 border-gray-400 text-center">
                <span class="text-xs font-bold text-gray-400">2ÈME MEILLEUR PRIX</span>
                <h3 class="font-bold text-lg mt-2">Achat au Détail</h3>
                <p class="text-2xl font-extrabold text-gray-700 mt-2">${aLaCartePrice.toFixed(2)} €</p>
                <p class="text-xs text-gray-500 mt-1">Articles achetés séparément</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-2xl border-t-4 border-orange-500 transform md:-translate-y-4 text-center">
                <span class="text-xs font-bold text-orange-500 tracking-wider">🏆 MEILLEUR PRIX</span>
                <h3 class="font-bold text-xl mt-2">Menu M</h3>
                <p class="text-3xl font-extrabold text-orange-600 mt-2">${menuMPrice.toFixed(2)} €</p>
                <p class="text-xs text-gray-500 mt-1">La formule la plus rentable</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-t-4 border-amber-600 text-center">
                <span class="text-xs font-bold text-amber-600">3ÈME MEILLEUR PRIX</span>
                <h3 class="font-bold text-lg mt-2">Menu King Size</h3>
                <p class="text-2xl font-extrabold text-gray-700 mt-2">${menuKingSizePrice.toFixed(2)} €</p>
                <p class="text-xs text-gray-500 mt-1">Format maxi</p>
            </div>
        `;
    }

    loadCatalog();
</script>
</body>
</html>
