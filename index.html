<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger King Combo Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 min-h-screen py-6 px-4 text-stone-800">
    <div class="max-w-6xl mx-auto">
        <!-- En-tête -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-orange-600 tracking-tight">
                🍔 Burger King Combo Optimizer
            </h1>
            <p class="text-sm text-stone-500 mt-1" id="catalog-status">
                Connexion au catalogue Burger King via n8n...
            </p>
        </header>

        <!-- Section 1 : Sélection des envies -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-stone-200 mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-5">
                <h2 class="text-xl font-bold text-stone-800">1. Sélectionne ce que tu veux manger</h2>
                <!-- Barre de recherche rapide -->
                <div class="relative w-full md:w-80">
                    <input
                        type="text"
                        id="quick-search"
                        oninput="handleQuickSearch()"
                        placeholder="🔍 Recherche rapide (Frites, Coca, Whopper...)"
                        class="w-full pl-3 pr-3 py-2 text-sm border border-stone-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none"
                    />
                    <div id="quick-search-results" class="hidden absolute z-20 mt-1 w-full bg-white border border-stone-200 rounded-lg shadow-xl max-h-72 overflow-y-auto"></div>
                </div>
            </div>

            <!-- 4 Catégories de produits -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <!-- Burgers / Wraps / Salades / Box -->
                <div class="bg-stone-50 p-3.5 rounded-xl border border-stone-200 flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">🍔 Burgers, Wraps & Box</label>
                        <select id="select-main" class="w-full p-2 text-sm border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-orange-500 mb-2.5">
                            <option value="">-- Choisir un plat --</option>
                        </select>
                    </div>
                    <button onclick="addFromSelect('select-main')" class="w-full bg-orange-100 text-orange-800 py-2 rounded-lg text-sm font-semibold hover:bg-orange-200 transition">
                        + Ajouter au panier
                    </button>
                </div>

                <!-- Frites & Snacks -->
                <div class="bg-stone-50 p-3.5 rounded-xl border border-stone-200 flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">🍟 Frites, Nuggets & Snacks</label>
                        <select id="select-side" class="w-full p-2 text-sm border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-orange-500 mb-2.5">
                            <option value="">-- Choisir un snack / side --</option>
                        </select>
                    </div>
                    <button onclick="addFromSelect('select-side')" class="w-full bg-orange-100 text-orange-800 py-2 rounded-lg text-sm font-semibold hover:bg-orange-200 transition">
                        + Ajouter au panier
                    </button>
                </div>

                <!-- Boissons & Cafés -->
                <div class="bg-stone-50 p-3.5 rounded-xl border border-stone-200 flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">🥤 Boissons & Cafés</label>
                        <select id="select-drink" class="w-full p-2 text-sm border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-orange-500 mb-2.5">
                            <option value="">-- Choisir une boisson --</option>
                        </select>
                    </div>
                    <button onclick="addFromSelect('select-drink')" class="w-full bg-orange-100 text-orange-800 py-2 rounded-lg text-sm font-semibold hover:bg-orange-200 transition">
                        + Ajouter au panier
                    </button>
                </div>

                <!-- Glaces, Desserts & Sauces -->
                <div class="bg-stone-50 p-3.5 rounded-xl border border-stone-200 flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-stone-700 mb-2">🍦 Glaces, Desserts & Sauces</label>
                        <select id="select-sweet" class="w-full p-2 text-sm border border-stone-300 rounded-lg bg-white focus:ring-2 focus:ring-orange-500 mb-2.5">
                            <option value="">-- Choisir dessert / sauce --</option>
                        </select>
                    </div>
                    <button onclick="addFromSelect('select-sweet')" class="w-full bg-orange-100 text-orange-800 py-2 rounded-lg text-sm font-semibold hover:bg-orange-200 transition">
                        + Ajouter au panier
                    </button>
                </div>
            </div>

            <!-- Options d'optimisation -->
            <div class="flex flex-col sm:flex-row gap-4 bg-amber-50/70 border border-amber-200 rounded-xl p-3.5 mb-6 text-sm">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-upgrades" checked onchange="recalculateIfVisible()" class="w-4 h-4 accent-orange-600 rounded">
                    <span><b>Autoriser la taille supérieure</b> si j'ai choisi une taille précise mais que plus grand coûte moins cher</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="opt-kids" checked onchange="recalculateIfVisible()" class="w-4 h-4 accent-orange-600 rounded">
                    <span><b>Inclure les Menus Enfants</b> <span class="text-stone-500">(King Junior / King JR+)</span></span>
                </label>
            </div>

            <!-- Panier -->
            <div class="border-t border-stone-200 pt-4 mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-base font-bold text-stone-700">🛒 Ton Panier d'envies</h3>
                    <button onclick="clearCart()" id="btn-clear-cart" class="hidden text-xs text-red-600 hover:underline font-semibold">
                        Vider le panier
                    </button>
                </div>
                <div id="cart-list" class="bg-stone-50 p-4 rounded-xl border border-stone-200 text-sm text-stone-600 min-h-[64px]">
                    <span class="italic text-stone-400">Ton panier est vide... Tu peux choisir une taille précise ou « 📏 Peu importe la taille » !</span>
                </div>
            </div>

            <button
                id="btn-calculate"
                onclick="calculateBestCombinations()"
                disabled
                class="w-full bg-orange-600 disabled:bg-stone-300 text-white py-3.5 rounded-xl font-extrabold text-base hover:bg-orange-700 transition shadow-lg"
            >
                Calculer le vrai Top 3 des prix sur la borne 🚀
            </button>
        </div>

        <!-- Section 2 : Résultats Podium Top 3 -->
        <div id="results-container" class="hidden">
            <div id="retail-banner" class="bg-white border border-stone-200 rounded-xl p-4 mb-6 text-center shadow-sm"></div>
            <h2 class="text-2xl font-extrabold mb-6 text-center text-stone-800">
                🏆 Top 3 des combinaisons exactes à commander sur la borne
            </h2>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-stretch" id="podium-grid"></div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n.mvincent.xyz/webhook/burger-king-prices';

        let catalog = null;
        let productsById = {};
        let buyableProducts = [];
        let multiSizeFamilies = {}; // indexé par familyKey
        let multiSizeFamiliesList = [];

        // Panier stocké sous forme :
        // - Produit précis : { key: 'PROD:50002', isFamily: false, id: '50002', qty: 1 }
        // - Peu importe la taille : { key: 'FAM:frites', isFamily: true, familyKey: 'frites', qty: 1 }
        let cart = [];

        function toCents(euros) {
            return Math.round((Number(euros) || 0) * 100);
        }

        function formatEuros(cents) {
            return (cents / 100).toFixed(2).replace('.', ',') + ' €';
        }

        function normalizeText(str) {
            return (str || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/®|™/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function capitalizeFirst(str) {
            const s = (str || '').trim();
            return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
        }

        // Détecte la famille de taille d'un produit (Frites, Boissons cl, Snacks xN, Sundae, Fusion)
        function parseProductProfile(prod) {
            const rawName = (prod.name || '').trim();
            const norm = normalizeText(rawName);

            // 1. Petites / Moyennes / Grandes (ex: Frites, Gaufrettes)
            const sizeAdjMatch = norm.match(/^(petites?|moyennes?|grandes?)\s+(.+)$/);
            if (sizeAdjMatch) {
                const adj = sizeAdjMatch[1];
                const baseNorm = sizeAdjMatch[2].trim();
                const rank = adj.startsWith('petit') ? 1 : (adj.startsWith('moyen') ? 2 : 3);
                const cleanBase = rawName.replace(/^(petites?|moyennes?|grandes?)\s+/i, '').trim();
                return {
                    family: `adj:${baseNorm}`,
                    displayName: capitalizeFirst(cleanBase),
                    rank,
                    exactName: norm
                };
            }

            // 2. Boissons avec contenance en cl : ex "Coca-Cola® (40cl)"
            const clMatch = norm.match(/^(.*?)\s*\(?(\d+)\s*cl\)?$/);
            if (clMatch && clMatch[1].trim()) {
                const cleanBase = rawName.replace(/\s*\(?\d+\s*cl\)?$/i, '').trim();
                return {
                    family: `drink:${clMatch[1].trim()}`,
                    displayName: cleanBase,
                    rank: parseInt(clMatch[2], 10),
                    exactName: norm
                };
            }

            // 3. Snacks par quantité : ex "Onion Rings (6)", "King Nuggets® (7)", "Chili Cheese (4)"
            const countMatch = norm.match(/^(.*?)\s*\((\d+)\)$/);
            if (countMatch && countMatch[1].trim()) {
                const cleanBase = rawName.replace(/\s*\(\d+\)$/, '').trim();
                return {
                    family: `count:${countMatch[1].trim()}`,
                    displayName: cleanBase,
                    rank: parseInt(countMatch[2], 10),
                    exactName: norm
                };
            }

            // 4. Mini King Sundae / King Sundae
            const sundaeMatch = norm.match(/^(mini\s+)?(king sundae\s+.+)$/);
            if (sundaeMatch) {
                const cleanBase = rawName.replace(/^mini\s+/i, '').trim();
                return {
                    family: `sundae:${sundaeMatch[2].trim()}`,
                    displayName: cleanBase,
                    rank: sundaeMatch[1] ? 1 : 2,
                    exactName: norm
                };
            }

            // 5. King Fusion / Extra King Fusion
            const fusionMatch = norm.match(/^(extra\s+)?(king fusion\s+.+)$/);
            if (fusionMatch) {
                const cleanBase = rawName.replace(/^extra\s+/i, '').trim();
                return {
                    family: `fusion:${fusionMatch[2].trim()}`,
                    displayName: cleanBase,
                    rank: fusionMatch[1] ? 2 : 1,
                    exactName: norm
                };
            }

            return {
                family: `exact:${norm}`,
                displayName: rawName,
                rank: 1,
                exactName: norm
            };
        }

        // Vérifie si un produit proposé dans une étape de menu correspond à la ligne du panier
        function checkGroupCompatibility(cartGroup, menuProd, allowUpgrades) {
            if (cartGroup.isFamily) {
                return menuProd._profile.family === cartGroup.family.key ? 'any_size' : null;
            }

            const wantedProd = cartGroup.product;
            if (wantedProd.id === menuProd.id) return 'exact';

            const wProf = wantedProd._profile;
            const mProf = menuProd._profile;

            if (wProf.exactName === mProf.exactName) return 'exact';

            if (allowUpgrades && wProf.family === mProf.family && mProf.rank > wProf.rank) {
                return 'upgrade';
            }

            return null;
        }

        function getUiBucket(prod) {
            const cat = prod.category || '';
            const sub = prod.subCategory || '';

            if (cat === 'Burgers' || cat === 'Tortillas & Wraps' || cat === 'À partager' || sub === 'Petits Burgers') {
                return 'main';
            }
            if (cat === 'Salades') {
                return prod.stepTypes?.includes('SIDE') ? 'side' : 'main';
            }
            if (cat === 'Snacks & Sauces') {
                return sub === 'Sauces' ? 'sweet' : 'side';
            }
            if (cat === 'Desserts & Boissons') {
                const sweetSubs = ['Ice Burger', 'King Sundae', 'King Fusion', 'Extra King Fusion', 'Pâtisseries'];
                if (sweetSubs.includes(sub) || (prod.stepTypes?.includes('SWEET') && !prod.stepTypes?.includes('DRINK'))) {
                    return 'sweet';
                }
                return 'drink';
            }
            return 'main';
        }

        async function loadCatalog() {
            const statusEl = document.getElementById('catalog-status');
            try {
                const response = await fetch(WEBHOOK_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const rawData = await response.json();
                const payload = Array.isArray(rawData) ? rawData[0] : rawData;

                if (!payload || !payload.catalog) {
                    throw new Error('Réponse JSON invalide depuis n8n');
                }

                catalog = payload.catalog;
                productsById = {};

                for (const p of catalog.products) {
                    p._profile = parseProductProfile(p);
                    p._aloneCents = toCents(p.prices?.alone ?? 0);
                    productsById[p.id] = p;
                }

                buyableProducts = catalog.products
                    .filter(p => p.canBuyAlone && p._aloneCents > 0)
                    .sort((a, b) => a.name.localeCompare(b.name, 'fr'));

                // Construire automatiquement les familles ayant au moins 2 tailles achetables
                const tempFamilies = {};
                for (const p of buyableProducts) {
                    const fKey = p._profile.family;
                    if (!tempFamilies[fKey]) tempFamilies[fKey] = [];
                    tempFamilies[fKey].push(p);
                }

                multiSizeFamilies = {};
                for (const [fKey, members] of Object.entries(tempFamilies)) {
                    // Vérifier qu'il y a au moins 2 rangs/tailles distincts
                    const distinctRanks = new Set(members.map(m => m._profile.rank));
                    if (members.length >= 2 && distinctRanks.size >= 2) {
                        members.sort((a, b) => (a._profile.rank - b._profile.rank) || (a._aloneCents - b._aloneCents));
                        const cheapestMember = [...members].sort((a, b) => a._aloneCents - b._aloneCents)[0];
                        const rep = members[0];
                        const famObj = {
                            key: fKey,
                            name: rep._profile.displayName,
                            bucket: getUiBucket(rep),
                            groupLabel: (rep.subCategory || rep.category || 'Autres').trim(),
                            members,
                            cheapestMember,
                            minAloneCents: cheapestMember._aloneCents
                        };
                        multiSizeFamilies[fKey] = famObj;
                        for (const m of members) {
                            m._familyObj = famObj;
                        }
                    }
                }

                multiSizeFamiliesList = Object.values(multiSizeFamilies)
                    .sort((a, b) => a.name.localeCompare(b.name, 'fr'));

                populateAllSelects();

                statusEl.textContent = `✅ Catalogue chargé (${catalog.menus.length} menus, ${buyableProducts.length} produits, ${multiSizeFamiliesList.length} familles multi-tailles)`;
                statusEl.className = 'text-sm text-emerald-700 font-medium mt-1';
                document.getElementById('btn-calculate').disabled = false;
            } catch (error) {
                console.error('Erreur chargement n8n :', error);
                statusEl.textContent = `❌ Impossible de charger le catalogue n8n (${error.message}).`;
                statusEl.className = 'text-sm text-red-600 font-semibold mt-1';
            }
        }

        function populateSelectWithGroups(selectId, items, bucketName) {
            const select = document.getElementById(selectId);
            const firstOpt = select.options[0];
            select.innerHTML = '';
            select.appendChild(firstOpt);

            const groups = {};
            for (const item of items) {
                const groupLabel = (item.subCategory || item.category || 'Autres').trim();
                if (!groups[groupLabel]) groups[groupLabel] = [];
                groups[groupLabel].push(item);
            }

            // Associer les familles multi-tailles au bon optgroup
            const familiesByGroup = {};
            for (const fam of multiSizeFamiliesList) {
                if (fam.bucket !== bucketName) continue;
                if (!familiesByGroup[fam.groupLabel]) familiesByGroup[fam.groupLabel] = [];
                familiesByGroup[fam.groupLabel].push(fam);
            }

            const allGroupNames = Array.from(new Set([...Object.keys(groups), ...Object.keys(familiesByGroup)]))
                .sort((a, b) => a.localeCompare(b, 'fr'));

            for (const groupName of allGroupNames) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = groupName;

                // 1. Options "Peu importe la taille" en tête du sous-groupe
                for (const fam of (familiesByGroup[groupName] || [])) {
                    const opt = document.createElement('option');
                    opt.value = `FAM:${fam.key}`;
                    opt.textContent = `📏 ${fam.name} (Peu importe la taille) — dès ${formatEuros(fam.minAloneCents)}`;
                    optgroup.appendChild(opt);
                }

                // 2. Tailles précises individuelles
                for (const item of (groups[groupName] || [])) {
                    const opt = document.createElement('option');
                    opt.value = `PROD:${item.id}`;
                    opt.textContent = `${item.name} — ${formatEuros(item._aloneCents)}`;
                    optgroup.appendChild(opt);
                }

                select.appendChild(optgroup);
            }
        }

        function populateAllSelects() {
            const buckets = { main: [], side: [], drink: [], sweet: [] };
            for (const p of buyableProducts) {
                buckets[getUiBucket(p)].push(p);
            }
            populateSelectWithGroups('select-main', buckets.main, 'main');
            populateSelectWithGroups('select-side', buckets.side, 'side');
            populateSelectWithGroups('select-drink', buckets.drink, 'drink');
            populateSelectWithGroups('select-sweet', buckets.sweet, 'sweet');
        }

        // Recherche rapide incluant les options "Peu importe la taille" + les produits précis
        function handleQuickSearch() {
            const input = document.getElementById('quick-search');
            const box = document.getElementById('quick-search-results');
            const q = normalizeText(input.value);

            if (!q || q.length < 2) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const famMatches = multiSizeFamiliesList
                .filter(f => normalizeText(f.name).includes(q))
                .slice(0, 5);

            const prodMatches = buyableProducts
                .filter(p => normalizeText(p.name).includes(q))
                .slice(0, 8);

            if (famMatches.length === 0 && prodMatches.length === 0) {
                box.innerHTML = `<div class="p-3 text-xs text-stone-400 italic">Aucun produit trouvé</div>`;
                box.classList.remove('hidden');
                return;
            }

            const famHtml = famMatches.map(f => `
                <button
                    type="button"
                    onclick="addCartToken('FAM:${escapeAttr(f.key)}'); closeQuickSearch();"
                    class="w-full text-left px-3 py-2 text-sm bg-orange-50/60 hover:bg-orange-100 flex justify-between items-center border-b border-orange-100"
                >
                    <span>
                        <span class="font-bold text-orange-900">📏 ${escapeHtml(f.name)}</span>
                        <span class="text-xs text-orange-700 font-semibold ml-1">(Peu importe la taille)</span>
                    </span>
                    <span class="text-xs font-bold text-orange-700 ml-2 whitespace-nowrap">dès ${formatEuros(f.minAloneCents)}</span>
                </button>
            `).join('');

            const prodHtml = prodMatches.map(p => `
                <button
                    type="button"
                    onclick="addCartToken('PROD:${escapeAttr(p.id)}'); closeQuickSearch();"
                    class="w-full text-left px-3 py-2 text-sm hover:bg-stone-100 flex justify-between items-center border-b last:border-b-0 border-stone-100"
                >
                    <span class="font-medium text-stone-800">${escapeHtml(p.name)}</span>
                    <span class="text-xs font-bold text-orange-600 ml-2 whitespace-nowrap">+ ${formatEuros(p._aloneCents)}</span>
                </button>
            `).join('');

            box.innerHTML = famHtml + prodHtml;
            box.classList.remove('hidden');
        }

        function closeQuickSearch() {
            document.getElementById('quick-search').value = '';
            document.getElementById('quick-search-results').classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            const box = document.getElementById('quick-search-results');
            const input = document.getElementById('quick-search');
            if (box && !box.contains(e.target) && e.target !== input) {
                box.classList.add('hidden');
            }
        });

        function addFromSelect(selectId) {
            const select = document.getElementById(selectId);
            if (!select.value) return;
            addCartToken(select.value);
            select.value = '';
        }

        function addCartToken(token) {
            const existing = cart.find(c => c.key === token);
            if (existing) {
                existing.qty += 1;
            } else if (token.startsWith('FAM:')) {
                const familyKey = token.slice(4);
                if (!multiSizeFamilies[familyKey]) return;
                cart.push({ key: token, isFamily: true, familyKey, qty: 1 });
            } else if (token.startsWith('PROD:')) {
                const id = token.slice(5);
                if (!productsById[id]) return;
                cart.push({ key: token, isFamily: false, id, qty: 1 });
            }
            updateCartDisplay();
            recalculateIfVisible();
        }

        // Permet de changer directement dans le panier entre "Peu importe la taille" et une taille précise
        function switchCartEntryMode(cartIndex, newToken) {
            const current = cart[cartIndex];
            if (!current || current.key === newToken) return;

            const existingTargetIdx = cart.findIndex((c, idx) => idx !== cartIndex && c.key === newToken);
            if (existingTargetIdx !== -1) {
                cart[existingTargetIdx].qty += current.qty;
                cart.splice(cartIndex, 1);
            } else if (newToken.startsWith('FAM:')) {
                const familyKey = newToken.slice(4);
                cart[cartIndex] = { key: newToken, isFamily: true, familyKey, qty: current.qty };
            } else if (newToken.startsWith('PROD:')) {
                const id = newToken.slice(5);
                cart[cartIndex] = { key: newToken, isFamily: false, id, qty: current.qty };
            }

            updateCartDisplay();
            recalculateIfVisible();
        }

        function changeQtyByIndex(idx, delta) {
            if (!cart[idx]) return;
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartDisplay();
            recalculateIfVisible();
        }

        function clearCart() {
            cart = [];
            updateCartDisplay();
            document.getElementById('results-container').classList.add('hidden');
        }

        function recalculateIfVisible() {
            const resultsEl = document.getElementById('results-container');
            if (!resultsEl.classList.contains('hidden') && cart.length > 0) {
                calculateBestCombinations();
            }
        }

        function updateCartDisplay() {
            const cartList = document.getElementById('cart-list');
            const clearBtn = document.getElementById('btn-clear-cart');

            if (cart.length === 0) {
                clearBtn.classList.add('hidden');
                cartList.innerHTML = `<span class="italic text-stone-400">Ton panier est vide... Tu peux choisir une taille précise ou « 📏 Peu importe la taille » !</span>`;
                return;
            }

            clearBtn.classList.remove('hidden');
            let totalRetailCents = 0;

            const rowsHtml = cart.map((entry, idx) => {
                let title = '';
                let unitCents = 0;
                let unitSubtext = '';
                let famObj = null;

                if (entry.isFamily) {
                    famObj = multiSizeFamilies[entry.familyKey];
                    title = famObj.name;
                    unitCents = famObj.minAloneCents;
                    unitSubtext = `dès ${formatEuros(unitCents)} seul (${famObj.cheapestMember.name})`;
                } else {
                    const p = productsById[entry.id];
                    famObj = p._familyObj || null;
                    title = famObj ? famObj.name : p.name;
                    unitCents = p._aloneCents;
                    unitSubtext = `${formatEuros(unitCents)} / unité`;
                }

                const lineCents = unitCents * entry.qty;
                totalRetailCents += lineCents;

                // Sélecteur de taille directement intégré dans la ligne du panier si la famille a plusieurs tailles
                let sizeSelectorHtml = '';
                if (famObj) {
                    const famToken = `FAM:${famObj.key}`;
                    const optionsHtml = [
                        `<option value="${escapeAttr(famToken)}" ${entry.key === famToken ? 'selected' : ''}>📏 Peu importe la taille</option>`,
                        ...famObj.members.map(m => {
                            const mToken = `PROD:${m.id}`;
                            return `<option value="${escapeAttr(mToken)}" ${entry.key === mToken ? 'selected' : ''}>🎯 ${escapeHtml(m.name)} (${formatEuros(m._aloneCents)})</option>`;
                        })
                    ].join('');

                    sizeSelectorHtml = `
                        <select
                            onchange="switchCartEntryMode(${idx}, this.value)"
                            class="mt-1 sm:mt-0 sm:ml-2 text-xs font-semibold rounded-lg px-2 py-1 border ${entry.isFamily ? 'bg-orange-50 border-orange-300 text-orange-800' : 'bg-white border-stone-300 text-stone-700'} focus:ring-2 focus:ring-orange-500"
                        >
                            ${optionsHtml}
                        </select>
                    `;
                }

                return `
                    <div class="flex flex-wrap justify-between items-center py-2.5 border-b last:border-b-0 border-stone-200 gap-2">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-1">
                            <div>
                                <span class="font-bold text-stone-800">${escapeHtml(title)}</span>
                                <span class="text-xs text-stone-500 ml-1">(${escapeHtml(unitSubtext)})</span>
                            </div>
                            ${sizeSelectorHtml}
                        </div>
                        <div class="flex items-center gap-2 ml-auto">
                            <button onclick="changeQtyByIndex(${idx}, -1)" class="w-7 h-7 rounded-lg bg-stone-200 hover:bg-stone-300 font-bold text-stone-700">−</button>
                            <span class="w-6 text-center font-bold text-stone-800">${entry.qty}</span>
                            <button onclick="changeQtyByIndex(${idx}, 1)" class="w-7 h-7 rounded-lg bg-stone-200 hover:bg-stone-300 font-bold text-stone-700">+</button>
                            <span class="w-20 text-right font-bold text-orange-600">${formatEuros(lineCents)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            cartList.innerHTML = `
                ${rowsHtml}
                <div class="flex justify-between items-center pt-3 mt-1 text-stone-700 font-bold">
                    <span>Total minimum si pris 100 % à l'unité :</span>
                    <span class="text-stone-900">${formatEuros(totalRetailCents)}</span>
                </div>
            `;
        }

        function getSupplementCents(prod, sizeCode) {
            if (!prod || !prod.prices) return 0;
            const key = String(sizeCode || 'm').toLowerCase();
            return toCents(prod.prices[key] ?? 0);
        }

        function getBestBonusOptionForStep(step, sizeCode) {
            let minSupp = Infinity;
            const evaluated = [];

            for (const pid of step.productIds) {
                const prod = productsById[pid];
                if (!prod) continue;
                const supp = getSupplementCents(prod, sizeCode);
                evaluated.push({ prod, supp });
                if (supp < minSupp) minSupp = supp;
            }

            const cheapestList = evaluated.filter(e => e.supp === minSupp);

            cheapestList.sort((a, b) => {
                const score = (p) => {
                    const n = normalizeText(p.name);
                    if (n.includes('rien du tout')) return 100;
                    if (n.includes('sundae') || n.includes('ice') || n.includes('fusion') || n.includes('donut')) return 90;
                    if (n.includes('burger') || n.includes('nuggets') || n.includes('fries') || n.includes('frites') || n.includes('onion') || n.includes('chili')) return 80;
                    if (n.includes('coca') || n.includes('fanta') || n.includes('sprite') || n.includes('fuze') || n.includes('oasis')) return 70;
                    return 50;
                };
                return score(b.prod) - score(a.prod);
            });

            return {
                chosenProd: cheapestList[0].prod,
                supplementCents: minSupp,
                samePriceAlternatives: cheapestList.map(c => c.prod)
            };
        }

        function buildCandidateActions(cartGroups, allowUpgrades, allowKids) {
            const T = cartGroups.length;
            const actions = [];

            // 1. Actions "À l'unité" (pour une famille "Peu importe la taille", on prend la taille la moins chère vendue seule)
            for (let g = 0; g < T; g++) {
                const cg = cartGroups[g];
                const prod = cg.isFamily ? cg.family.cheapestMember : cg.product;
                const consume = new Array(T).fill(0);
                consume[g] = 1;
                actions.push({
                    kind: 'ALONE',
                    costCents: prod._aloneCents,
                    consume,
                    signature: `ALONE:${prod.id}`,
                    product: prod,
                    fromAnySize: cg.isFamily,
                    familyName: cg.isFamily ? cg.family.name : null
                });
            }

            // 2. Actions "Menu"
            const menuBucketsByConsume = new Map();

            for (const menu of catalog.menus) {
                if (!allowKids && menu.kidsMenu) continue;

                for (const sizeObj of menu.sizes) {
                    const baseCents = toCents(sizeObj.price);
                    const steps = sizeObj.steps;
                    const k = steps.length;

                    const stepChoices = steps.map((step) => {
                        const bonus = getBestBonusOptionForStep(step, sizeObj.size);
                        const groupMatches = [];

                        for (let g = 0; g < T; g++) {
                            const cg = cartGroups[g];
                            let bestMatch = null;

                            for (const pid of step.productIds) {
                                const mProd = productsById[pid];
                                if (!mProd) continue;
                                const matchType = checkGroupCompatibility(cg, mProd, allowUpgrades);
                                if (!matchType) continue;

                                const supp = getSupplementCents(mProd, sizeObj.size);
                                const cand = {
                                    groupIdx: g,
                                    prod: mProd,
                                    supp,
                                    matchType,
                                    rank: mProd._profile.rank,
                                    rankDiff: cg.isFamily ? 0 : Math.abs(mProd._profile.rank - cg.product._profile.rank)
                                };

                                if (!bestMatch) {
                                    bestMatch = cand;
                                } else if (cand.supp < bestMatch.supp) {
                                    bestMatch = cand;
                                } else if (cand.supp === bestMatch.supp) {
                                    if (cg.isFamily) {
                                        // En mode "Peu importe la taille", à prix identique dans le même menu, on préfère la plus grande taille !
                                        if (cand.rank > bestMatch.rank) bestMatch = cand;
                                    } else {
                                        if (cand.matchType === 'exact' && bestMatch.matchType !== 'exact') {
                                            bestMatch = cand;
                                        } else if (cand.matchType === bestMatch.matchType && cand.rankDiff < bestMatch.rankDiff) {
                                            bestMatch = cand;
                                        }
                                    }
                                }
                            }

                            if (bestMatch) groupMatches.push(bestMatch);
                        }

                        return { step, bonus, groupMatches };
                    });

                    if (stepChoices.every(sc => sc.groupMatches.length === 0)) continue;

                    const bestForThisMenuSize = new Map();
                    const curConsume = new Array(T).fill(0);
                    const curStepsDetail = new Array(k);

                    function dfsSteps(stepIdx, runningSuppCents) {
                        if (stepIdx === k) {
                            let anyCovered = false;
                            for (let g = 0; g < T; g++) {
                                if (curConsume[g] > 0) { anyCovered = true; break; }
                            }
                            if (!anyCovered) return;

                            const consumeKey = curConsume.join(',');
                            const totalCents = baseCents + runningSuppCents;
                            const prev = bestForThisMenuSize.get(consumeKey);

                            if (!prev || totalCents < prev.costCents) {
                                bestForThisMenuSize.set(consumeKey, {
                                    kind: 'MENU',
                                    menu,
                                    sizeObj,
                                    costCents: totalCents,
                                    baseCents,
                                    consume: [...curConsume],
                                    consumeKey,
                                    signature: `MENU:${menu.id}:${sizeObj.size}:${curStepsDetail.map(s => s.prod.id).join('+')}`,
                                    stepsDetail: curStepsDetail.map(s => ({ ...s }))
                                });
                            }
                            return;
                        }

                        const sc = stepChoices[stepIdx];

                        for (const m of sc.groupMatches) {
                            const cg = cartGroups[m.groupIdx];
                            if (curConsume[m.groupIdx] + 1 <= cg.qty) {
                                curConsume[m.groupIdx] += 1;
                                curStepsDetail[stepIdx] = {
                                    mode: 'matched',
                                    stepName: sc.step.name,
                                    stepType: sc.step.stepType,
                                    prod: m.prod,
                                    wantedLabel: cg.isFamily ? `${cg.family.name} (peu importe la taille)` : cg.product.name,
                                    matchType: m.matchType,
                                    supplementCents: m.supp
                                };
                                dfsSteps(stepIdx + 1, runningSuppCents + m.supp);
                                curConsume[m.groupIdx] -= 1;
                            }
                        }

                        curStepsDetail[stepIdx] = {
                            mode: 'bonus',
                            stepName: sc.step.name,
                            stepType: sc.step.stepType,
                            prod: sc.bonus.chosenProd,
                            supplementCents: sc.bonus.supplementCents,
                            alternatives: sc.bonus.samePriceAlternatives
                        };
                        dfsSteps(stepIdx + 1, runningSuppCents + sc.bonus.supplementCents);
                    }

                    dfsSteps(0, 0);

                    for (const candidate of bestForThisMenuSize.values()) {
                        if (!menuBucketsByConsume.has(candidate.consumeKey)) {
                            menuBucketsByConsume.set(candidate.consumeKey, []);
                        }
                        menuBucketsByConsume.get(candidate.consumeKey).push(candidate);
                    }
                }
            }

            for (const list of menuBucketsByConsume.values()) {
                list.sort((a, b) => a.costCents - b.costCents);
                for (const item of list.slice(0, 6)) {
                    actions.push(item);
                }
            }

            actions.forEach((act, idx) => { act.actionId = idx; });
            return actions;
        }

        class MinHeap {
            constructor() { this.data = []; }
            size() { return this.data.length; }
            push(item) {
                this.data.push(item);
                let i = this.data.length - 1;
                while (i > 0) {
                    const p = (i - 1) >> 1;
                    if (this.data[p].costCents <= this.data[i].costCents) break;
                    [this.data[p], this.data[i]] = [this.data[i], this.data[p]];
                    i = p;
                }
            }
            pop() {
                if (this.data.length === 0) return null;
                const top = this.data[0];
                const last = this.data.pop();
                if (this.data.length > 0) {
                    this.data[0] = last;
                    let i = 0;
                    const n = this.data.length;
                    while (true) {
                        let smallest = i;
                        const l = 2 * i + 1;
                        const r = 2 * i + 2;
                        if (l < n && this.data[l].costCents < this.data[smallest].costCents) smallest = l;
                        if (r < n && this.data[r].costCents < this.data[smallest].costCents) smallest = r;
                        if (smallest === i) break;
                        [this.data[i], this.data[smallest]] = [this.data[smallest], this.data[i]];
                        i = smallest;
                    }
                }
                return top;
            }
        }

        function findTop3Combinations(cartGroups, actions) {
            const T = cartGroups.length;
            const initialRem = cartGroups.map(cg => cg.qty);

            const actionsByFirstGroup = Array.from({ length: T }, () => []);
            for (const act of actions) {
                const firstG = act.consume.findIndex(v => v > 0);
                if (firstG !== -1) actionsByFirstGroup[firstG].push(act);
            }

            const heap = new MinHeap();
            heap.push({
                costCents: 0,
                rem: initialRem,
                minActionId: 0,
                chosenActions: []
            });

            const solutions = [];
            const seenSolutionSignatures = new Set();
            const visitsPerState = new Map();
            let expansions = 0;
            const MAX_EXPANSIONS = 25000;

            while (heap.size() > 0 && solutions.length < 3 && expansions < MAX_EXPANSIONS) {
                const state = heap.pop();
                expansions++;

                const firstGroup = state.rem.findIndex(q => q > 0);

                if (firstGroup === -1) {
                    const menuSig = state.chosenActions
                        .filter(a => a.kind === 'MENU')
                        .map(a => `${a.menu.id}:${a.sizeObj.size}`)
                        .sort()
                        .join('|');
                    const aloneSig = state.chosenActions
                        .filter(a => a.kind === 'ALONE')
                        .map(a => a.product.id)
                        .sort()
                        .join('|');
                    const fullSig = `M[${menuSig}]_A[${aloneSig}]`;

                    if (!seenSolutionSignatures.has(fullSig)) {
                        seenSolutionSignatures.add(fullSig);
                        solutions.push(state);
                    }
                    continue;
                }

                const stateKey = `${state.rem.join(',')}|${state.minActionId}`;
                const countVisits = (visitsPerState.get(stateKey) || 0) + 1;
                if (countVisits > 6) continue;
                visitsPerState.set(stateKey, countVisits);

                const candidates = actionsByFirstGroup[firstGroup];
                for (const act of candidates) {
                    if (act.actionId < state.minActionId) continue;

                    let fits = true;
                    for (let g = firstGroup; g < T; g++) {
                        if (act.consume[g] > state.rem[g]) {
                            fits = false;
                            break;
                        }
                    }
                    if (!fits) continue;

                    const nextRem = new Array(T);
                    for (let g = 0; g < T; g++) {
                        nextRem[g] = state.rem[g] - act.consume[g];
                    }

                    const nextFirstGroup = nextRem.findIndex(q => q > 0);
                    const nextMinActionId = (nextFirstGroup === firstGroup) ? act.actionId : 0;

                    heap.push({
                        costCents: state.costCents + act.costCents,
                        rem: nextRem,
                        minActionId: nextMinActionId,
                        chosenActions: [...state.chosenActions, act]
                    });
                }
            }

            return solutions;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return escapeHtml(str).replace(/'/g, '&#39;');
        }

        function formatMenuTitle(rawName, sizeCode) {
            const trimmed = (rawName || '').trim();
            const withPrefix = /^menu\b/i.test(trimmed) ? trimmed : `Menu ${trimmed}`;
            return `${withPrefix} (${sizeCode})`;
        }

        function calculateBestCombinations() {
            if (!catalog || cart.length === 0) return;

            const allowUpgrades = document.getElementById('opt-upgrades').checked;
            const allowKids = document.getElementById('opt-kids').checked;

            const cartGroups = cart.map(entry => {
                if (entry.isFamily) {
                    const fam = multiSizeFamilies[entry.familyKey];
                    return { isFamily: true, family: fam, unitAloneCents: fam.minAloneCents, qty: entry.qty };
                }
                const prod = productsById[entry.id];
                return { isFamily: false, product: prod, unitAloneCents: prod._aloneCents, qty: entry.qty };
            });

            const retailCents = cartGroups.reduce((sum, cg) => sum + cg.unitAloneCents * cg.qty, 0);
            const actions = buildCandidateActions(cartGroups, allowUpgrades, allowKids);
            const topSolutions = findTop3Combinations(cartGroups, actions);

            const resultsContainer = document.getElementById('results-container');
            const retailBanner = document.getElementById('retail-banner');
            const podiumGrid = document.getElementById('podium-grid');

            resultsContainer.classList.remove('hidden');

            if (topSolutions.length === 0) {
                podiumGrid.innerHTML = `<div class="col-span-3 text-center text-red-600 font-bold">Aucune combinaison trouvée.</div>`;
                return;
            }

            const bestSavings = retailCents - topSolutions[0].costCents;
            retailBanner.innerHTML = bestSavings > 0
                ? `<p class="text-sm md:text-base text-stone-700">
                     Prix minimum si pris séparément à l'unité : <b class="line-through text-stone-500">${formatEuros(retailCents)}</b>
                     — Avec la combinaison #1, tu paies <b class="text-emerald-700">${formatEuros(topSolutions[0].costCents)}</b>
                     soit <span class="inline-block bg-emerald-100 text-emerald-800 font-extrabold px-2.5 py-0.5 rounded-full ml-1">−${formatEuros(bestSavings)} d'économie réelle</span> !
                   </p>`
                : `<p class="text-sm md:text-base text-stone-700">
                     Prix optimal vérifié : <b class="text-orange-600">${formatEuros(topSolutions[0].costCents)}</b>
                     <span class="text-stone-500">(aucun menu n'est moins cher que l'achat à l'unité pour cette sélection, voici les options les plus proches)</span>.
                   </p>`;

            const cardsHtml = [];

            if (topSolutions[1]) {
                cardsHtml.push(renderSolutionCard(topSolutions[1], 2, retailCents, 'order-2 lg:order-1'));
            } else {
                cardsHtml.push(`<div class="hidden lg:block lg:order-1"></div>`);
            }

            cardsHtml.push(renderSolutionCard(topSolutions[0], 1, retailCents, 'order-1 lg:order-2 lg:-translate-y-3'));

            if (topSolutions[2]) {
                cardsHtml.push(renderSolutionCard(topSolutions[2], 3, retailCents, 'order-3 lg:order-3'));
            } else {
                cardsHtml.push(`<div class="hidden lg:block lg:order-3"></div>`);
            }

            podiumGrid.innerHTML = cardsHtml.join('');
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

                }
                aloneGrouped[a.product.id].qty += 1;

                    <ul class="text-sm space-y-1.5">
                        ${aloneList.map(item => {
                            const path = (item.product.paths && item.product.paths[0]) ? item.product.paths[0] : item.product.category;
                            const anyNote = item.anySizeNotes.size > 0
                                ? `<div class="text-xs text-orange-700 font-medium">📏 Format le moins cher à l'unité</div>`
                                : '';
                            return `
                                <li class="flex justify-between items-start gap-2 border-b last:border-b-0 border-stone-200/70 pb-1 last:pb-0">
                                    <div>
                                        <span class="font-semibold text-stone-800">${item.qty}× ${escapeHtml(item.product.name)}</span>
                                        <div class="text-xs text-stone-500">📍 ${escapeHtml(path)}</div>
                                        ${anyNote}
                                    </div>
                                    <span class="font-bold text-stone-700 whitespace-nowrap">${formatEuros(item.product._aloneCents * item.qty)}</span>
                                </li>
                            `;
                        }).join('')}
                    </ul>
                </div>
            ` : '';

            return `
                <div class="bg-white rounded-2xl p-5 border-t-8 ${rankStyles.border} flex flex-col justify-between ${orderClasses}">
                    <div>
                        <div class="text-center mb-4">
                            <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full tracking-wider ${rankStyles.badgeBg}">
                                ${rankStyles.badgeLabel}
                            </span>
                            <h3 class="font-extrabold text-lg text-stone-800 mt-3">${escapeHtml(title)}</h3>
                            <p class="${rankStyles.priceColor} font-black mt-1">${formatEuros(solution.costCents)}</p>
                            ${diffBadge}
                        </div>
                        <div class="border-t border-stone-200 pt-3">
                            <p class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">
                                Marche à suivre sur la borne :
                            </p>
                            ${menusHtml}
                            ${alonesHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        loadCatalog();
    </script>
</body>
</html>
